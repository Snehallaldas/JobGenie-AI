version: '3.8'

services:
  db:
    image: postgres:15
    container_name: jobgenie_db
    restart: always
    environment:
      POSTGRES_DB: jobgenie
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: